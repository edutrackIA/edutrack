name: E2E

# The whole stack in a real browser. Runs on pull requests to main (releases) and on
# demand: it takes several minutes, too long for every feature branch.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: cp .env.example .env

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml/requirements.txt

      - name: Train the model (not stored in Git)
        working-directory: services/ml
        run: |
          pip install -r requirements.txt
          python -m training.train --quick

      - name: Start the backend
        run: |
          docker compose up -d --build mysql mailpit ml api
          for attempt in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/v1/health && break
            sleep 2
          done

      - name: Migrate and load demo data
        run: |
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m scripts.seed_dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Run Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Backend logs
        if: failure()
        run: docker compose logs api ml --tail 200
