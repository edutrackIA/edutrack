name: ML Service

on:
  push:
    branches: [develop, main]
    paths:
      - "services/ml/**"
      - ".github/workflows/ml.yml"
  pull_request:
    paths:
      - "services/ml/**"
      - ".github/workflows/ml.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
