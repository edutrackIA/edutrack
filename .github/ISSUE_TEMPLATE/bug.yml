name: Bug
description: Reportar un error
labels: ["type: bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
  - type: dropdown
    id: component
    attributes:
      label: Componente
      options: [web, api, ml, infra]
