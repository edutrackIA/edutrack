<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBFCFE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1626" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Seguimiento académico y alerta temprana para colegios." />
    <title>EduTrack</title>
    <script>
      // Applies the theme before the first paint to avoid a white flash.
      ;(function () {
        try {
          var preference = localStorage.getItem('edutrack.theme') || 'system'
          var dark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          /* storage or matchMedia unavailable: keep the light theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
